[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-dfd"
version = "0.1.0"
description = "Vietnamese scene text recognition: diacritic-factorized distillation research scaffold"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["dfd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
