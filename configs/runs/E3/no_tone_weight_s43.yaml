# Shared E1/E2 budget fixed from the RTX 3060 batch probe; KD values remain tuning candidates.
experiment: E3
stage: train
variant: no_tone_weight
seed: 43
model:
  backbone: parseq_tiny
  head: factorized
  pretrained: true
  teacher_backbone: parseq_small
  teacher_checkpoint: null
  eos_policy: eos_class_0_none_level
data:
  dataset: VinText
  root: null
  vocab_path: null
  split_manifest: null
  subset_manifest: null
  image_size:
  - 32
  - 128
  normalization: NFC
  training_fraction: 1.0
training:
  epochs: 20
  batch_size: 64
  lr: 0.0007
  optimizer: AdamW
  schedule: one_cycle
  amp: true
  checkpoint_metric: validation_word_acc
  accumulate_grad_batches: 1
  warmup_pct: 0.075
  weight_decay: 0.0
  num_workers: 4
  augmentation: photometric_randaugment_m5_n3
distillation:
  enabled: true
  mode: marginal
  temperature: 2.0
  lambda: 1.0
  component_weights:
    base: 1.0
    modifier: 1.0
    tone: 1.0
  tone_confidence_weight: false
composition:
  validity_mask: true
evaluation:
  splits:
  - test
  - unseen_test
  subsets:
  - all
  - diacritic_heavy
  - small_crops
  - rare_combinations
  case_sensitive: false
  precision: fp32
  cross_dataset: null
benchmark:
  runtime: onnxruntime
  cpu_threads: 4
  batch_size: 1
  warmup_runs: 50
  timed_runs: 500
  statistic: median
  gpu_batch_size: 64
output:
  root: results
  save_predictions: true
  save_resolved_config: true
